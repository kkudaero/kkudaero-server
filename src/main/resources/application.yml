spring:
  application:
    name: kkudaero-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

kkudaero:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  customs:
    poll-interval: PT30M
    poll-initial-delay: PT1M
    poll-max-order-age: P90D
  encryption:
    key: ${PERSONAL_DATA_ENCRYPTION_KEY}
  exchange:
    url: https://apis.data.go.kr/1220000/retrieveTrifFxrtInfo/getRetrieveTrifFxrtInfo
    service-key: ${CUSTOMS_EXCHANGE_SERVICE_KEY:}
    connect-timeout: PT3S
    read-timeout: PT5S
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
  unipass:
    cargo-progress-url: https://unipass.customs.go.kr:38010/ext/rest/cargCsclPrgsInfoQry/retrieveCargCsclPrgsInfo
    api-key: ${UNIPASS_API_KEY:}
    connect-timeout: PT3S
    read-timeout: PT5S
    cache-ttl: PT10M
    cache-max-size: 1000
